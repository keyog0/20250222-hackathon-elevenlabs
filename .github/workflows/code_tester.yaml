name: Test develop branch
on:
  pull_request:
    branches:
      - develop
    paths-ignore:
      - "docker/**"
      - ".github/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test environment Setup Python..
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - id: step1
        name: Checkout
        uses: actions/checkout@v2

      - id: step2
        name: Build, test
        env:
          ENV: test
        run: |
          docker build -t test_fastapi -f ./docker/Dockerfile .
          docker run --rm -e ENV_NAME=test -e PYTHONUNBUFFERED=1 test_fastapi python -m pytest tests
